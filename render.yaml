# Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tracer-dashboard
    env: python
    plan: free
    buildCommand: pip install . && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tracer-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_CHAT_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: USE_WEBHOOK
        value: true
      - key: TELEGRAM_WEBHOOK_URL
        fromService:
          type: web
          name: tracer-dashboard
          property: host
        prefix: https://
        suffix: /api/v1/telegram/webhook
      - key: APP_URL
        fromService:
          type: web
          name: tracer-dashboard
          property: host
        prefix: https://
      - key: WEBAPP_URL
        fromService:
          type: web
          name: tracer-dashboard
          property: host
        prefix: https://
        suffix: /webapp

databases:
  - name: tracer-db
    plan: free
    databaseName: tracer
    user: tracer
