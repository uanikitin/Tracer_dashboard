# Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Для деплоя: Dashboard → New → Blueprint Instance → connect GitHub repo
# База данных уже создана на Render, DATABASE_URL задаётся вручную.

services:
  - type: web
    name: tracer-dashboard
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install . && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # задать вручную: postgresql+asyncpg://tracer_user:...@.../tracer
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_CHAT_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: USE_WEBHOOK
        value: true
      - key: PYTHON_VERSION
        value: "3.12.3"
