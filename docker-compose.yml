version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://tracer:tracer@db:5432/tracer
      - BOT_TOKEN=${BOT_TOKEN}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - APP_ENV=development
      - DEBUG=true
      - APP_URL=http://localhost:8000
      - WEBAPP_URL=http://localhost:8000/webapp
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=tracer
      - POSTGRES_PASSWORD=tracer
      - POSTGRES_DB=tracer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
